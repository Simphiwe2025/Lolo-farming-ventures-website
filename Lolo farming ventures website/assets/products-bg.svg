<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7e6" />
      <stop offset="100%" stop-color="#f7e7ce" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend mode="overlay" in2="SourceGraphic" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />

  <!-- Subtle egg shapes -->
  <g fill="#f4a261" opacity="0.12">
    <ellipse cx="160" cy="180" rx="120" ry="90" />
    <ellipse cx="420" cy="280" rx="140" ry="110" />
    <ellipse cx="900" cy="120" rx="170" ry="130" />
    <ellipse cx="980" cy="420" rx="140" ry="100" />
    <ellipse cx="260" cy="540" rx="160" ry="120" />
  </g>

  <!-- Hills silhouette -->
  <path d="M0,700 C150,600 300,700 480,640 C660,580 780,700 1000,650 C1120,620 1200,660 1200,800 L0,800 Z" fill="#e29e43" opacity="0.08" />

  <rect width="100%" height="100%" fill="black" opacity="0" filter="url(#grain)" />
</svg>